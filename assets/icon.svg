<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="arch-design-wiki">
  <title>arch-design-wiki</title>
  <rect width="64" height="64" rx="14" fill="#1f3a5f"/>
  <!-- a design space: two dimensions (hollow), their values (filled), and one design point (the path) -->
  <g stroke="#9fb8d6" stroke-width="2.2" fill="none" stroke-linecap="round">
    <line x1="16" y1="20" x2="16" y2="46"/>
    <line x1="32" y1="14" x2="32" y2="50"/>
    <line x1="48" y1="20" x2="48" y2="46"/>
  </g>
  <polyline points="16,38 32,22 48,40" fill="none" stroke="#f2b84b" stroke-width="3.2" stroke-linejoin="round"
            stroke-linecap="round"/>
  <g fill="#9fb8d6">
    <circle cx="16" cy="26" r="3.2"/><circle cx="32" cy="34" r="3.2"/><circle cx="32" cy="44" r="3.2"/>
    <circle cx="48" cy="28" r="3.2"/>
  </g>
  <g fill="#f2b84b">
    <circle cx="16" cy="38" r="4.2"/><circle cx="32" cy="22" r="4.2"/><circle cx="48" cy="40" r="4.2"/>
  </g>
</svg>
