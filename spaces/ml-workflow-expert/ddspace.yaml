# ddspace workspace settings: the expert ML-workflow design space of the study, imported from a decision model.
# `ddspace point` describes design points with the generation model below.
models:
  generation_llm: "openai/gpt-5.6-luna"
  evaluation_llm: "openai/gpt-5.6-luna"
  matching_llm: "openai/gpt-5.6-luna"
  embedding: "openai/text-embedding-3-small"
taxonomy:
  name: "c1-e"
  use_case: "Identify the architectural design decisions that practitioners face when designing and implementing machine learning systems along the machine learning workflow \u2014 from data ingestion and processing, through model building and training, to putting models into production and operating them \u2014 as documented in practitioner (gray) literature. For each decision, identify the alternative decision options practitioners use or consider, the forces (quality attributes, constraints and practical concerns) that drive the choice between them, and how decisions relate to one another. Each dimension must name one architectural design decision; its values are the alternative options for that decision."
workspace:
  sources_dir: "sources"
  current_run: "runs/20261108_202031"
wiki:
  quotes: false
  source_summaries: false
  design_points: "none"
  core_min_sources: 0
  stale_after: null
